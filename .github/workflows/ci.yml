name: checks

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Reject common committed secret formats
        run: |
          if git grep -nE '(sk|rk)_(live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}' -- .; then
            echo 'Potential Stripe secret material found in tracked files.' >&2
            exit 1
          fi
      - run: npx wrangler deploy --dry-run --outdir dist-dry-run
